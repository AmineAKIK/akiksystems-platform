name: Systems seed repair

on:
  push:
    branches:
      - codex/systems-code-only-v1-1

permissions:
  contents: write

jobs:
  seed:
    if: contains(github.event.head_commit.message, '[systems-seed]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies and media runtime
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y libvips-tools libavif-bin

      - name: Restore Systems implementation
        run: tar -xzf .systems-seed.tar.gz

      - name: Optimize dossier media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public/systems
          vips copy apps/web/public/systems-source/hero.jpg "apps/web/public/systems/hero.webp[Q=72,strip]"
          avifenc --jobs all --min 24 --max 36 --speed 6 apps/web/public/systems-source/hero.jpg apps/web/public/systems/hero.avif
          for name in cirrus mosaic radar-cli sonar detour; do
            vips copy "apps/web/public/systems-source/$name.png" "apps/web/public/systems/$name.webp[Q=72,strip]"
            avifenc --jobs all --min 24 --max 36 --speed 6 "apps/web/public/systems-source/$name.png" "apps/web/public/systems/$name.avif"
          done
          test "$(stat -c%s apps/web/public/systems/hero.webp)" -le 327680
          test "$(stat -c%s apps/web/public/systems/hero.avif)" -le 327680
          test "$(stat -c%s apps/web/public/systems/cirrus.webp)" -le 225280
          test "$(stat -c%s apps/web/public/systems/cirrus.avif)" -le 225280
          for name in mosaic radar-cli; do
            test "$(stat -c%s apps/web/public/systems/$name.webp)" -le 184320
            test "$(stat -c%s apps/web/public/systems/$name.avif)" -le 184320
          done
          for name in sonar detour; do
            test "$(stat -c%s apps/web/public/systems/$name.webp)" -le 92160
            test "$(stat -c%s apps/web/public/systems/$name.avif)" -le 92160
          done

      - name: Format Systems implementation
        run: |
          pnpm exec prettier --write             apps/web/app/components/experience-shell.tsx             apps/web/app/components/systems             apps/web/app/content/systems.types.ts             apps/web/app/content/systems-page-content.ts             apps/web/app/root.tsx             apps/web/app/routes/locale-layout.tsx             apps/web/app/routes/systems.tsx             apps/web/app/routes/systems.test.tsx             apps/web/app/styles/systems.css             apps/web/scripts/smoke-systems-browser.cjs

      - name: Commit prepared implementation
        shell: bash
        run: |
          rm -f .systems-seed.tar.gz
          rm -rf apps/web/public/systems-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build code-only Systems experience"
          git push
