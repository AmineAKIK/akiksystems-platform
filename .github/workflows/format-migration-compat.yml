name: Format migration compatibility

on:
  push:
    branches:
      - fix/divergent-migration-history

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/divergent-migration-history

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format compatibility test
        run: pnpm exec prettier --write packages/db/src/cli/migrator.test.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- packages/db/src/cli/migrator.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/cli/migrator.test.ts
          git commit -m "Format migration compatibility test"
          git push origin HEAD:fix/divergent-migration-history
