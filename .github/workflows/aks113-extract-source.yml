name: AKS-113 source extraction

on:
  pull_request:
    paths:
      - '.tmp/aks113-source.pdf'
      - '.github/workflows/aks113-extract-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install PDF text tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Extract canonical essay text
        run: |
          mkdir -p .tmp/extracted
          pdfinfo .tmp/aks113-source.pdf | sed -n 's/^Pages:[[:space:]]*/Pages: /p' > .tmp/extracted/rendre-l-attention-au-reel.txt
          pdftotext -nopgbrk .tmp/aks113-source.pdf - >> .tmp/extracted/rendre-l-attention-au-reel.txt

      - name: Build native Writing v1 document from canonical source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          source = Path('.tmp/extracted/rendre-l-attention-au-reel.txt')
          lines = source.read_text(encoding='utf-8').splitlines()
          chapters = [
              ('01', 'Le travail ordinaire comme point de départ'),
              ('02', 'L’attention et la construction de la maîtrise'),
              ('03', 'ProtoCap : matérialiser des hypothèses'),
              ('04', 'Un outil discret, un système intelligible'),
              ('05', 'Céline : les principes à l’épreuve'),
              ('06', 'Évaluer ce qui change réellement'),
              ('07', 'Du gain opérationnel à la maîtrise'),
              ('08', 'Indicateurs, marges et apprentissage'),
              ('09', 'Raccourcir la boucle de transformation'),
              ('10', 'L’IA et la répartition des responsabilités'),
              ('11', 'Repenser la place de l’humain'),
              ('12', 'Revenir au réel'),
          ]
          chapter_by_number = dict(chapters)
          heading_fragments = {
              '01': {'Le travail ordinaire comme point de', 'départ'},
              '02': {'L’attention et la construction de la', 'maîtrise'},
              '03': {'ProtoCap : matérialiser des', 'hypothèses'},
              '04': {'Un outil discret, un système', 'intelligible'},
              '08': {'Indicateurs, marges et', 'apprentissage'},
              '09': {'Raccourcir la boucle de', 'transformation'},
              '10': {'L’IA et la répartition des', 'responsabilités'},
          }

          def text_node(text):
              return {'type': 'text', 'text': text}

          def paragraph(text):
              return {'type': 'paragraph', 'content': [text_node(text)]}

          content = [
              paragraph('Technologie, travail et maîtrise des systèmes'),
              paragraph('Un essai de AKIK Mohamed Amine · AkikSystems'),
              paragraph(
                  'De l’expérience du terrain à ProtoCap et Céline : concevoir des systèmes '
                  'qui préservent l’attention et développent la capacité d’agir.'
              ),
              {
                  'type': 'heading',
                  'attrs': {'level': 2},
                  'content': [text_node('Le fil de la réflexion')],
              },
              paragraph('Du terrain à une autre manière de concevoir les systèmes.'),
              {
                  'type': 'orderedList',
                  'content': [
                      {
                          'type': 'listItem',
                          'content': [paragraph(title)],
                      }
                      for _, title in chapters
                  ],
              },
          ]

          current = None
          buffer = []

          def flush():
              nonlocal_buffer = None
              if buffer:
                  text = ' '.join(part.strip() for part in buffer).replace('  ', ' ').strip()
                  if text:
                      content.append(paragraph(text))
                  buffer.clear()

          for raw in lines:
              line = raw.strip()
              if not line:
                  continue

              marker = re.match(r'^(\\d{2}) / RÉFLEXION$', line)
              if marker:
                  flush()
                  current = marker.group(1)
                  content.append(
                      {
                          'type': 'heading',
                          'attrs': {'level': 2},
                          'content': [text_node(chapter_by_number[current])],
                      }
                  )
                  continue

              if current is None:
                  continue

              if (
                  line in {'RENDRE L’ATTENTION AU RÉEL', 'ESSAI'}
                  or line == 'AKIK Mohamed Amine / AkikSystems'
                  or re.match(r'^\\d{2} / 25$', line)
              ):
                  flush()
                  continue

              title = chapter_by_number[current]
              if (
                  line == title
                  or line == title + ' · suite'
                  or line in heading_fragments.get(current, set())
                  or (line.endswith(' · suite') and line[:-8].strip() == title)
              ):
                  continue

              if line.startswith('http://') or line.startswith('https://'):
                  flush()
                  content.append(paragraph(line))
                  continue

              if current == '12' and line in {
                  'ProtoCap — dépôt public :',
                  'Démonstration en ligne :',
              }:
                  flush()
                  content.append(paragraph(line))
                  continue

              buffer.append(line)
              if re.search(r'[.!?…»]$', line):
                  flush()

          flush()

          document = {'version': 1, 'type': 'doc', 'content': content}
          if len(content) != 213:
              raise SystemExit(f'Unexpected block count: {len(content)}')

          serialized = json.dumps(document, ensure_ascii=False, indent=2) + '\\n'
          output = Path('packages/db/src/rendre-attention-essay-document.json')
          output.write_text(serialized, encoding='utf-8')
          print(f'Generated {len(content)} blocks at {output}.')
          PY

      - name: Commit generated canonical document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/rendre-attention-essay-document.json
          if git diff --cached --quiet; then
            echo "Canonical document already up to date."
            exit 0
          fi
          git commit -m "Add canonical AKS-113 essay document"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload extracted essay source
        uses: actions/upload-artifact@v4
        with:
          name: aks113-source-text
          path: .tmp/extracted/rendre-l-attention-au-reel.txt
          if-no-files-found: error
          retention-days: 1
