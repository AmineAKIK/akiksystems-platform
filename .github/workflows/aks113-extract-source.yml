name: AKS-113 source extraction

on:
  push:
    branches:
      - ami-272-aks-113-publish-the-existing-essay-as-the-first-major-case
    paths:
      - '.tmp/aks113-source.pdf'
      - '.github/workflows/aks113-extract-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install PDF text tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate canonical Writing document from PDF layout
        run: |
          mkdir -p .tmp/extracted
          pdftotext -bbox-layout .tmp/aks113-source.pdf .tmp/extracted/essay.xhtml
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          chapters = [
              ('01', 'Le travail ordinaire comme point de départ'),
              ('02', 'L’attention et la construction de la maîtrise'),
              ('03', 'ProtoCap : matérialiser des hypothèses'),
              ('04', 'Un outil discret, un système intelligible'),
              ('05', 'Céline : les principes à l’épreuve'),
              ('06', 'Évaluer ce qui change réellement'),
              ('07', 'Du gain opérationnel à la maîtrise'),
              ('08', 'Indicateurs, marges et apprentissage'),
              ('09', 'Raccourcir la boucle de transformation'),
              ('10', 'L’IA et la répartition des responsabilités'),
              ('11', 'Repenser la place de l’humain'),
              ('12', 'Revenir au réel'),
          ]
          chapter_by_number = dict(chapters)

          root = ET.parse('.tmp/extracted/essay.xhtml').getroot()
          namespace = ''
          if root.tag.startswith('{'):
              namespace = root.tag.split('}', 1)[0] + '}'

          def block_text(block):
              words = [
                  (word.text or '').strip()
                  for word in block.iter(namespace + 'word')
                  if (word.text or '').strip()
              ]
              return re.sub(r'\s+', ' ', ' '.join(words)).strip()

          blocks = []
          for block in root.iter(namespace + 'block'):
              text = block_text(block)
              if text:
                  blocks.append(text)

          def text_node(text):
              return {'type': 'text', 'text': text}

          def paragraph(text):
              return {'type': 'paragraph', 'content': [text_node(text)]}

          content = [
              paragraph('Technologie, travail et maîtrise des systèmes'),
              paragraph('Un essai de AKIK Mohamed Amine · AkikSystems'),
              paragraph(
                  'De l’expérience du terrain à ProtoCap et Céline : concevoir des systèmes '
                  'qui préservent l’attention et développent la capacité d’agir.'
              ),
              {
                  'type': 'heading',
                  'attrs': {'level': 2},
                  'content': [text_node('Le fil de la réflexion')],
              },
              paragraph('Du terrain à une autre manière de concevoir les systèmes.'),
              {
                  'type': 'orderedList',
                  'content': [
                      {
                          'type': 'listItem',
                          'content': [paragraph(title)],
                      }
                      for _, title in chapters
                  ],
              },
          ]

          current = None
          for text in blocks:
              marker = None
              if text.endswith(' / RÉFLEXION') and len(text) >= 13:
                  prefix = text.split(' / ', 1)[0]
                  if prefix in chapter_by_number:
                      marker = prefix
              if marker is not None:
                  current = marker
                  content.append({
                      'type': 'heading',
                      'attrs': {'level': 2},
                      'content': [text_node(chapter_by_number[current])],
                  })
                  continue

              if current is None:
                  continue

              if (
                  text in {'RENDRE L’ATTENTION AU RÉEL', 'ESSAI', 'AKIK Mohamed Amine / AkikSystems'}
                  or re.fullmatch(r'\d{2} / 25', text)
              ):
                  continue

              title = chapter_by_number[current]
              if text == title or text == title + ' · suite':
                  continue

              if current == '12' and text in {
                  'ProtoCap — dépôt public :',
                  'Démonstration en ligne :',
                  'https://github.com/AmineAKIK/protocap',
                  'https://protocap-production.up.railway.app/',
              }:
                  content.append(paragraph(text))
                  continue

              content.append(paragraph(text))

          if len(content) < 50 or len(content) > 250:
              raise SystemExit(f'Unexpected Writing block count: {len(content)}')

          document = {'version': 1, 'type': 'doc', 'content': content}
          target = Path('packages/db/src/rendre-attention-essay-document.ts')
          target.write_text(
              "import type { WritingDocument } from '@akiksystems/core';\n\n"
              + 'export const rendreAttentionEssayDocument = '
              + json.dumps(document, ensure_ascii=False, indent=2)
              + ' satisfies WritingDocument;\n',
              encoding='utf-8',
          )
          print(f'Generated {len(content)} Writing blocks.')
          PY

      - name: Commit generated canonical document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/rendre-attention-essay-document.ts
          if git diff --cached --quiet; then
            echo "Canonical document already up to date."
            exit 0
          fi
          git commit -m "Add canonical AKS-113 essay document"
          git push origin HEAD:${{ github.ref_name }}
