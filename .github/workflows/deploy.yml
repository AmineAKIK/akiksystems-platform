name: Deploy

# Every commit on main whose CI succeeded is deployed to the VPS. The runner
# only asks the server to deploy one SHA over a forced SSH command; the server
# builds, switches, verifies and rolls back on its own (deploy/vps/deploy.sh).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://akiksystems.com

    steps:
      - name: Deploy the verified commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Unexpected SHA: $SHA"; exit 1; }

          ssh_dir="$RUNNER_TEMP/ssh"
          install -d -m 700 "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          # One attempt only: repeated failures would trip fail2ban on the VPS.
          ssh -i "$ssh_dir/key" -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectionAttempts=1 \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" "deploy $SHA"

      - name: Check the public site
        shell: bash
        run: |
          set -euo pipefail
          for url in https://akiksystems.com/health https://akiksystems.com/en \
                     https://akiksystems.fr/fr https://akiksystems.fr/fr/profil; do
            code="$(curl -s -o /dev/null --max-time 15 -w '%{http_code}' "$url")"
            echo "$code $url"
            test "$code" = 200
          done
