name: Format Systems

on:
  push:
    branches:
      - feature/systems-code-only-v1-1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/systems-code-only-v1-1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Systems files
        run: |
          pnpm exec prettier --write             apps/web/app/styles/systems.css             apps/web/app/systems/content.ts             apps/web/app/systems/systems-page.tsx             apps/web/scripts/smoke-systems-browser.cjs

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet --             apps/web/app/styles/systems.css             apps/web/app/systems/content.ts             apps/web/app/systems/systems-page.tsx             apps/web/scripts/smoke-systems-browser.cjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/web/app/styles/systems.css             apps/web/app/systems/content.ts             apps/web/app/systems/systems-page.tsx             apps/web/scripts/smoke-systems-browser.cjs
          git commit -m "Format Systems implementation"
          git push origin HEAD:feature/systems-code-only-v1-1
