name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: akiksystems
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d akiksystems"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/akiksystems
      BUCKET: ci-placeholder
      REGION: us-east-1
      ENDPOINT: https://example.invalid
      ACCESS_KEY_ID: ci-placeholder
      SECRET_ACCESS_KEY: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install image processing runtime
        run: sudo apt-get update && sudo apt-get install -y libvips-tools

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runtime contracts
        run: |
          pnpm config:verify
          pnpm observability:verify

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build web production image
        run: docker build -f apps/web/Dockerfile -t akiksystems-web-ci .

      - name: Smoke web production image
        shell: bash
        run: |
          docker run --rm --entrypoint node akiksystems-web-ci -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies) process.exit(1)"
          docker run --rm -d --name akiksystems-web-ci-runtime --network host \
            -e NODE_ENV=production \
            -e PORT=4188 \
            -e DATABASE_URL="$DATABASE_URL" \
            akiksystems-web-ci
          trap 'docker logs akiksystems-web-ci-runtime || true; docker rm -f akiksystems-web-ci-runtime >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent -H 'Host: railway-healthcheck.invalid' http://127.0.0.1:4188/health >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent -H 'Host: railway-healthcheck.invalid' http://127.0.0.1:4188/health >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Host: railway-healthcheck.invalid' http://127.0.0.1:4188/en)" = "421"

      - name: Build worker production image
        run: docker build -f apps/worker/Dockerfile -t akiksystems-worker-ci .

      - name: Verify client/server boundary
        run: pnpm --filter @akiksystems/web check:client-secrets

      - name: Migrate database
        run: pnpm deploy:migrate

      - name: Verify database connectivity
        run: pnpm db:check

      - name: Verify Profile domain
        run: pnpm db:verify-public-profile

      - name: Verify System technology evidence
        run: pnpm db:verify-system-technologies

      - name: Verify System publication snapshots
        run: pnpm db:verify-system-publication-snapshots

      - name: Verify Work with us System selection
        run: pnpm db:verify-work-with-us-selected-proof

      - name: Verify Work with us inquiry persistence
        run: pnpm db:verify-work-with-us-inquiries

      - name: Verify Work with us inquiry handling
        run: pnpm db:verify-work-with-us-inquiry-handling

      - name: Smoke SSR
        run: pnpm smoke:web

      - name: Smoke observability
        run: pnpm smoke:observability

      - name: Smoke worker
        run: pnpm smoke:worker

      - name: Cache Chromium smoke runtime
        id: browser-runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/akiksystems-browser-runtime/node_modules
            /tmp/akiksystems-browser-runtime/ms-playwright
          key: ${{ runner.os }}-node24-browser-smoke-v1-pw1.55.0

      - name: Install Chromium smoke runtime
        if: steps.browser-runtime-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/akiksystems-browser-runtime/ms-playwright
        run: |
          mkdir -p /tmp/akiksystems-browser-runtime
          cd /tmp/akiksystems-browser-runtime
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Smoke public Profile
        env:
          NODE_PATH: /tmp/akiksystems-browser-runtime/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/akiksystems-browser-runtime/ms-playwright
        run: pnpm --filter @akiksystems/web smoke:profile-public

      - name: Smoke responsive Home
        env:
          NODE_PATH: /tmp/akiksystems-browser-runtime/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/akiksystems-browser-runtime/ms-playwright
        run: node apps/web/scripts/smoke-responsive-browser.cjs

      - name: Smoke public Systems
        env:
          NODE_PATH: /tmp/akiksystems-browser-runtime/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/akiksystems-browser-runtime/ms-playwright
        run: pnpm --filter @akiksystems/web smoke:systems-public
