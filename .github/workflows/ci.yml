name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify runtime contracts
        run: |
          pnpm config:verify
          pnpm observability:verify

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build web production image
        run: docker build -f apps/web/Dockerfile -t akiksystems-web-ci .

      - name: Smoke web production image
        shell: bash
        run: |
          docker run --rm --entrypoint node akiksystems-web-ci -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies) process.exit(1)"
          # Same hardening as deploy/vps/compose.yml.
          docker run --rm -d --name akiksystems-web-ci-runtime --network host \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e NODE_ENV=production \
            -e PORT=4188 \
            akiksystems-web-ci
          trap 'docker logs akiksystems-web-ci-runtime || true; docker rm -f akiksystems-web-ci-runtime >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent -H 'Host: healthcheck.invalid' http://127.0.0.1:4188/health >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent -H 'Host: healthcheck.invalid' http://127.0.0.1:4188/health >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Host: healthcheck.invalid' http://127.0.0.1:4188/en)" = "421"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Host: akiksystems.fr' http://127.0.0.1:4188/fr/profil)" = "200"
          docker exec akiksystems-web-ci-runtime node -e "fetch('http://127.0.0.1:4188/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"

      - name: Lint VPS deployment scripts
        run: shellcheck deploy/vps/deploy.sh deploy/vps/deploy-ssh.sh

      - name: Validate VPS Compose file
        run: GIT_SHA="$GITHUB_SHA" docker compose -f deploy/vps/compose.yml config --quiet

      - name: Verify client/server boundary
        run: pnpm --filter @akiksystems/web check:client-secrets

      - name: Smoke SSR
        run: pnpm smoke:web

      - name: Smoke observability
        run: pnpm smoke:observability

      # Playwright comes from the workspace (apps/web devDependencies); only Chromium is cached.
      - name: Cache Chromium smoke runtime
        id: browser-runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/akiksystems-browser-runtime/ms-playwright
          key: ${{ runner.os }}-browser-smoke-v2-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium smoke runtime
        if: steps.browser-runtime-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/akiksystems-browser-runtime/ms-playwright
        run: pnpm --filter @akiksystems/web exec playwright install --with-deps chromium

      - name: Smoke responsive Home (French and English)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/akiksystems-browser-runtime/ms-playwright
        run: pnpm --filter @akiksystems/web smoke:responsive

      - name: Smoke public Systems (French and English)
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/akiksystems-browser-runtime/ms-playwright
        run: pnpm --filter @akiksystems/web smoke:systems-public

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-snapshots
          path: |
            artifacts/systems
            artifacts/home
          if-no-files-found: error
