name: Responsive Home qualification

on:
  push:
    branches:
      - fix/preproduction-audit-2026-09-28

permissions:
  contents: read

jobs:
  responsive-home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/akiksystems
      BUCKET: ci-placeholder
      REGION: us-east-1
      ENDPOINT: https://example.invalid
      ACCESS_KEY_ID: ci-placeholder
      SECRET_ACCESS_KEY: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install image processing runtime
        run: sudo apt-get update && sudo apt-get install -y libvips-tools

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web runtime
        run: |
          pnpm --filter @akiksystems/core build
          pnpm --filter @akiksystems/db build
          pnpm --filter @akiksystems/web build

      - name: Cache Chromium smoke runtime
        id: browser-runtime-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /tmp/akiksystems-browser-runtime/node_modules
            /tmp/akiksystems-browser-runtime/ms-playwright
          key: ${{ runner.os }}-node24-browser-smoke-v1-pw1.55.0

      - name: Install Chromium smoke runtime
        if: steps.browser-runtime-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/akiksystems-browser-runtime/ms-playwright
        run: |
          mkdir -p /tmp/akiksystems-browser-runtime
          cd /tmp/akiksystems-browser-runtime
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund playwright@1.55.0
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Smoke responsive Home
        env:
          NODE_PATH: /tmp/akiksystems-browser-runtime/node_modules
          PLAYWRIGHT_BROWSERS_PATH: /tmp/akiksystems-browser-runtime/ms-playwright
        run: node apps/web/scripts/smoke-responsive-browser.cjs
